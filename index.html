<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZeroShare - P2P File Transfer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* Slate 800 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <header class="w-full max-w-md mt-4 mb-8 text-center">
        <div class="flex items-center justify-center gap-2 mb-2">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
            </svg>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">ZeroShare</h1>
        </div>
        <p class="text-slate-400 text-sm">Secure, peer-to-peer file transfer.</p>
    </header>

    <main class="w-full max-w-md space-y-6 flex-1">
        
        <!-- Connection Status & My ID -->
        <section class="glass-panel p-6 rounded-2xl shadow-xl">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Your Device</h2>
            <div class="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                <div class="flex flex-col overflow-hidden">
                    <span class="text-xs text-slate-500 mb-1">Your Connection ID</span>
                    <span id="my-id" class="text-emerald-400 font-mono text-sm truncate font-medium">Generating...</span>
                </div>
                <button onclick="copyMyId()" class="p-2 hover:bg-slate-700 rounded-md transition-colors text-slate-300" title="Copy ID">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Connect to Peer -->
        <section id="connect-section" class="glass-panel p-6 rounded-2xl shadow-xl transition-all duration-300">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Connect to Friend</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="peer-id-input" placeholder="Paste friend's ID here..." class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                <button onclick="connectToPeer()" id="connect-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                    </svg>
                    Connect
                </button>
            </div>
        </section>

        <!-- Active Connection Area (Hidden initially) -->
        <section id="active-connection-section" class="glass-panel p-6 rounded-2xl shadow-xl hidden">
            <div class="flex items-center justify-between mb-6 border-b border-slate-700 pb-4">
                <div>
                    <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">Connected</h2>
                    <p class="text-xs text-slate-400 truncate w-48 mt-1" id="connected-peer-id">Peer ID</p>
                </div>
                <button onclick="disconnectPeer()" class="text-xs text-red-400 hover:text-red-300 px-3 py-1 border border-red-900 rounded-full hover:bg-red-900/30 transition-colors">
                    Disconnect
                </button>
            </div>

            <!-- File Sender -->
            <div class="mb-6">
                <label for="file-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer bg-slate-800/30 hover:bg-slate-700/50 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="mb-1 text-sm text-slate-300"><span class="font-semibold">Tap to select file</span></p>
                        <p class="text-xs text-slate-500">Any file type up to ~1GB recommended</p>
                    </div>
                    <input id="file-input" type="file" class="hidden" onchange="handleFileSelect(event)" />
                </label>
                
                <div id="selected-file-info" class="hidden mt-3 p-3 bg-slate-900/50 rounded-lg border border-slate-700 flex items-center justify-between">
                    <div class="flex flex-col overflow-hidden w-3/4">
                        <span id="selected-file-name" class="text-sm font-medium text-slate-200 truncate">filename.txt</span>
                        <span id="selected-file-size" class="text-xs text-slate-500">0 KB</span>
                    </div>
                    <button onclick="sendFile()" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 px-4 rounded transition-colors">
                        Send
                    </button>
                </div>
            </div>

            <!-- Transfer Progress -->
            <div id="transfer-progress-container" class="hidden mb-6">
                <div class="flex justify-between text-xs mb-1">
                    <span id="transfer-status" class="text-slate-300">Sending...</span>
                    <span id="transfer-percent" class="text-blue-400 font-medium">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2">
                    <div id="transfer-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Received Files List -->
            <div>
                <h3 class="text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Received Files
                </h3>
                <ul id="received-files-list" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                    <!-- Files will be injected here -->
                    <li class="text-xs text-slate-500 italic text-center py-4" id="empty-files-msg">No files received yet.</li>
                </ul>
            </div>

        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 left-0 right-0 flex flex-col items-center gap-2 pointer-events-none z-50 px-4"></div>

    <script>
        // --- State Variables ---
        let peer = null;
        let connection = null;
        let selectedFile = null;
        
        // Chunking variables
        const CHUNK_SIZE = 16384; // 16KB per chunk to ensure reliable WebRTC transmission
        let receiveBuffer = [];
        let incomingFileInfo = null;
        let bytesReceived = 0;

        // UI Elements
        const myIdEl = document.getElementById('my-id');
        const connectSection = document.getElementById('connect-section');
        const activeSection = document.getElementById('active-connection-section');
        const connectedPeerIdEl = document.getElementById('connected-peer-id');
        const fileInput = document.getElementById('file-input');
        const selectedFileInfo = document.getElementById('selected-file-info');
        const selectedFileName = document.getElementById('selected-file-name');
        const selectedFileSize = document.getElementById('selected-file-size');
        const progressContainer = document.getElementById('transfer-progress-container');
        const transferStatus = document.getElementById('transfer-status');
        const transferPercent = document.getElementById('transfer-percent');
        const transferBar = document.getElementById('transfer-bar');
        const receivedList = document.getElementById('received-files-list');
        const emptyMsg = document.getElementById('empty-files-msg');
        const toastContainer = document.getElementById('toast-container');
        const connectBtn = document.getElementById('connect-btn');
        const sendBtn = document.getElementById('send-btn');

        // --- Utility Functions ---
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        // Custom Toast Notification (Replaces alert)
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            
            // Base styles
            let bgClass = 'bg-slate-800 border-slate-700 text-white';
            let icon = `<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            if (type === 'success') {
                bgClass = 'bg-emerald-900/90 border-emerald-700 text-emerald-50';
                icon = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else if (type === 'error') {
                bgClass = 'bg-red-900/90 border-red-700 text-red-50';
                icon = `<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-lg border shadow-lg pointer-events-auto max-w-sm w-full ${bgClass}`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium">${message}</span>`;
            
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function copyMyId() {
            if (!peer || !peer.id) return;
            try {
                // Try modern clipboard API first
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(peer.id);
                    showToast('ID copied to clipboard!', 'success');
                } else {
                    // Fallback for older browsers or iframes without clipboard permissions
                    const textArea = document.createElement("textarea");
                    textArea.value = peer.id;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    textArea.style.top = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    showToast('ID copied to clipboard!', 'success');
                }
            } catch (err) {
                console.error('Failed to copy: ', err);
                showToast('Failed to copy ID', 'error');
            }
        }

        // --- STREAMING_CHUNK:Initializing PeerJS Network... ---
        function initPeer() {
            // Initialize PeerJS. Using their free public server.
            // In a production app, you might want to run your own PeerJS server.
            peer = new Peer({
                debug: 2 // Log warnings and errors
            });

            peer.on('open', (id) => {
                myIdEl.textContent = id;
            });

            peer.on('connection', (conn) => {
                // Accept incoming connection
                if (connection && connection.open) {
                    // Already connected to someone, reject new connection
                    conn.on('open', () => {
                        conn.send({ type: 'system', message: 'User is busy.' });
                        setTimeout(() => conn.close(), 500);
                    });
                    return;
                }
                setupConnection(conn);
                showToast('A peer connected to you!', 'success');
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'peer-unavailable') {
                    showToast('Peer not found. Check the ID.', 'error');
                } else {
                    showToast(`Error: ${err.message}`, 'error');
                }
                connectBtn.disabled = false;
                connectBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Connect
                `;
            });
            
            peer.on('disconnected', () => {
                // Attempt to reconnect to signaling server if disconnected
                peer.reconnect();
            });
        }

        // --- STREAMING_CHUNK:Handling Connections... ---
        function connectToPeer() {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (!remoteId) {
                showToast('Please enter a peer ID', 'error');
                return;
            }
            if (remoteId === peer.id) {
                showToast('You cannot connect to yourself', 'error');
                return;
            }

            connectBtn.disabled = true;
            connectBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting...`;

            const conn = peer.connect(remoteId, {
                reliable: true
            });

            setupConnection(conn);
        }

        function setupConnection(conn) {
            connection = conn;

            connection.on('open', () => {
                // UI changes on successful connection
                connectSection.classList.add('hidden');
                activeSection.classList.remove('hidden');
                connectedPeerIdEl.textContent = connection.peer;
                
                // Reset states
                connectBtn.disabled = false;
                connectBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Connect
                `;
            });

            connection.on('data', handleIncomingData);

            connection.on('close', () => {
                showToast('Connection closed', 'info');
                resetConnectionUI();
            });
            
            connection.on('error', (err) => {
                showToast('Connection error', 'error');
                resetConnectionUI();
            });
        }

        function disconnectPeer() {
            if (connection) {
                connection.close();
            }
            resetConnectionUI();
        }

        function resetConnectionUI() {
            connection = null;
            connectSection.classList.remove('hidden');
            activeSection.classList.add('hidden');
            resetTransferUI();
            document.getElementById('peer-id-input').value = '';
        }

        // --- STREAMING_CHUNK:Handling Files and UI updates... ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            selectedFileName.textContent = file.name;
            selectedFileSize.textContent = formatBytes(file.size);
            selectedFileInfo.classList.remove('hidden');
        }

        function resetTransferUI() {
            progressContainer.classList.add('hidden');
            transferBar.style.width = '0%';
            transferPercent.textContent = '0%';
            selectedFile = null;
            fileInput.value = '';
            selectedFileInfo.classList.add('hidden');
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }

        // --- STREAMING_CHUNK:Chunked File Transfer Logic... ---
        function sendFile() {
            if (!selectedFile || !connection || !connection.open) {
                showToast('Cannot send file. Check connection.', 'error');
                return;
            }

            const file = selectedFile;
            
            // Prepare UI
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            progressContainer.classList.remove('hidden');
            transferStatus.textContent = `Sending ${file.name}`;
            transferStatus.className = "text-blue-300 truncate w-3/4";

            // Send metadata header
            connection.send({
                type: 'header',
                name: file.name,
                size: file.size,
                mime: file.type || 'application/octet-stream'
            });

            // Start reading and sending chunks
            let offset = 0;
            const reader = new FileReader();

            reader.onload = (e) => {
                // Send chunk
                connection.send({
                    type: 'chunk',
                    data: e.target.result
                });

                offset += e.target.result.byteLength;
                
                // Update UI Progress
                const percent = Math.min(100, Math.round((offset / file.size) * 100));
                transferBar.style.width = `${percent}%`;
                transferPercent.textContent = `${percent}%`;

                if (offset < file.size) {
                    // Read next chunk
                    readNextChunk();
                } else {
                    // Transfer complete
                    connection.send({ type: 'eof' });
                    showToast('File sent successfully!', 'success');
                    setTimeout(() => resetTransferUI(), 2000);
                }
            };

            reader.onerror = (err) => {
                showToast('Error reading file', 'error');
                resetTransferUI();
            };

            function readNextChunk() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }

            // Start loop
            readNextChunk();
        }

        // --- STREAMING_CHUNK:Receiving Data... ---
        function handleIncomingData(data) {
            if (data.type === 'system') {
                showToast(data.message, 'error');
                return;
            }

            if (data.type === 'header') {
                // Initialize receiver state
                incomingFileInfo = {
                    name: data.name,
                    size: data.size,
                    mime: data.mime
                };
                receiveBuffer = [];
                bytesReceived = 0;
                
                // Show progress UI
                progressContainer.classList.remove('hidden');
                transferStatus.textContent = `Receiving ${data.name}`;
                transferStatus.className = "text-emerald-400 truncate w-3/4";
                transferBar.classList.replace('bg-blue-500', 'bg-emerald-500');
                
            } else if (data.type === 'chunk') {
                
                receiveBuffer.push(data.data);
                bytesReceived += data.data.byteLength;
                
                // Update Progress UI
                if (incomingFileInfo && incomingFileInfo.size > 0) {
                    const percent = Math.min(100, Math.round((bytesReceived / incomingFileInfo.size) * 100));
                    transferBar.style.width = `${percent}%`;
                    transferPercent.textContent = `${percent}%`;
                }

            } else if (data.type === 'eof') {
                // Assemble file
                const blob = new Blob(receiveBuffer, { type: incomingFileInfo.mime });
                const downloadUrl = URL.createObjectURL(blob);
                
                addFileToList(incomingFileInfo.name, incomingFileInfo.size, downloadUrl);
                
                showToast(`Received ${incomingFileInfo.name}`, 'success');
                
                // Reset Receiver UI after short delay
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    transferBar.classList.replace('bg-emerald-500', 'bg-blue-500');
                    transferBar.style.width = '0%';
                    transferPercent.textContent = '0%';
                    incomingFileInfo = null;
                    receiveBuffer = [];
                }, 2000);
            }
        }

        // --- STREAMING_CHUNK:Managing the UI List... ---
        function addFileToList(name, size, url) {
            emptyMsg.style.display = 'none';
            
            const li = document.createElement('li');
            li.className = 'flex items-center justify-between p-3 bg-slate-900/50 border border-slate-700 rounded-lg hover:bg-slate-800 transition-colors';
            
            li.innerHTML = `
                <div class="flex flex-col overflow-hidden w-2/3">
                    <span class="text-sm text-slate-200 truncate" title="${name}">${name}</span>
                    <span class="text-xs text-slate-500">${formatBytes(size)}</span>
                </div>
                <a href="${url}" download="${name}" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded shadow-sm transition-colors flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Save
                </a>
            `;
            
            // Add to top of list
            receivedList.insertBefore(li, receivedList.firstChild);
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initPeer();
        });

    </script>
</body>
</html>
